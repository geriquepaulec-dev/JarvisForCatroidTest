name: Build Catroid APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Catroid
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Catroid APK
        run: |
          chmod +x gradlew
          ./gradlew :catroid:assembleCatroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Catroid-Debug-APK
          path: catroid/build/outputs/apk/**/*.apk
